<style>
  .mp {
    --mp-paper: #fbfcfa;
    --mp-ink: #1f2a24;
    --mp-muted: #66736b;
    --mp-line: #dde3dc;
    --mp-basil: #2f6b46;
    --mp-basil-soft: #e6f0e8;
    --mp-note: #fff1a8;
    --mp-note-ink: #5a4a00;
    --mp-danger: #a8322a;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--mp-ink);
    max-width: 52rem;
    margin: 0 auto;
    line-height: 1.4;
  }
  @media (prefers-color-scheme: dark) {
    .mp {
      --mp-paper: #18201b;
      --mp-ink: #e8eee9;
      --mp-muted: #9aa89f;
      --mp-line: #2e3a33;
      --mp-basil: #7fc497;
      --mp-basil-soft: #213328;
      --mp-note: #4a4114;
      --mp-note-ink: #ffe98a;
      --mp-danger: #ff8a80;
    }
  }
  .mp button { font: inherit; color: inherit; cursor: pointer; }
  .mp :focus-visible { outline: 2px solid var(--mp-basil); outline-offset: 2px; }

  .mp-tabs { display: flex; gap: .25rem; margin: 0 0 1rem; border-bottom: 1px solid var(--mp-line); }
  .mp-tab { background: none; border: 0; padding: .6rem .9rem; border-bottom: 3px solid transparent; color: var(--mp-muted); font-weight: 600; }
  .mp-tab[aria-selected="true"] { color: var(--mp-ink); border-bottom-color: var(--mp-basil); }

  .mp-week { font-size: .85rem; font-weight: 700; color: var(--mp-basil); margin: 1.5rem 0 .4rem; }
  .mp-week:first-child { margin-top: .25rem; }

  .mp-day { display: grid; grid-template-columns: 4.5rem 1fr 1fr; gap: .5rem; padding: .6rem 0; border-top: 1px solid var(--mp-line); }
  .mp-date { padding-top: .2rem; }
  .mp-date b { display: block; font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .mp-date span { font-size: .8rem; color: var(--mp-muted); }
  .mp-day.is-today .mp-date b { color: var(--mp-basil); }
  .mp-day.is-weekend { background: linear-gradient(to right, var(--mp-basil-soft), transparent 60%); }

  .mp-slot { display: flex; flex-direction: column; gap: .2rem; min-width: 0; }
  .mp-slot-label { font-size: .75rem; color: var(--mp-muted); }
  .mp-meal { text-align: left; background: var(--mp-paper); border: 1px solid var(--mp-line); border-radius: .6rem; padding: .5rem .6rem; display: flex; flex-direction: column; gap: .2rem; min-height: 3rem; }
  .mp-meal:hover { border-color: var(--mp-basil); }
  .mp-meal.is-empty { border-style: dashed; color: var(--mp-muted); justify-content: center; }
  .mp-name { font-weight: 650; overflow-wrap: anywhere; }
  .mp-desc { font-size: .88rem; color: var(--mp-muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .mp-note { font-size: .85rem; background: var(--mp-note); color: var(--mp-note-ink); border-radius: .3rem; padding: .15rem .4rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .mp-link { font-size: .85rem; color: var(--mp-basil); overflow-wrap: anywhere; align-self: flex-start; }

  @media (max-width: 560px) {
    .mp-day { grid-template-columns: 3.2rem 1fr; }
    .mp-day .mp-slot:last-child { grid-column: 2; }
  }

  .mp-search { width: 100%; box-sizing: border-box; font: inherit; padding: .55rem .7rem; border: 1px solid var(--mp-line); border-radius: .6rem; background: var(--mp-paper); color: var(--mp-ink); margin-bottom: .5rem; }
  .mp-empty { color: var(--mp-muted); padding: 2rem 0; text-align: center; }
  .mp-more { display: block; margin: 1rem auto; background: none; border: 1px solid var(--mp-line); border-radius: .6rem; padding: .5rem 1rem; }
  .mp-archive .mp-meal { cursor: default; }
  .mp-archive .mp-meal:hover { border-color: var(--mp-line); }

  .mp-status { min-height: 1.2em; font-size: .85rem; color: var(--mp-muted); text-align: center; }
  .mp-status.is-error { color: var(--mp-danger); }

  .mp-dialog { border: 0; border-radius: 1rem; padding: 0; width: min(28rem, calc(100vw - 2rem)); background: var(--mp-paper); color: var(--mp-ink); }
  .mp-dialog::backdrop { background: rgb(0 0 0 / .4); }
  .mp-dialog form { display: flex; flex-direction: column; gap: .8rem; padding: 1.2rem; }
  .mp-dialog h2 { margin: 0; font-size: 1.1rem; }
  .mp-dialog label { display: flex; flex-direction: column; gap: .25rem; font-size: .85rem; color: var(--mp-muted); }
  .mp-dialog input, .mp-dialog textarea { font: inherit; color: var(--mp-ink); background: transparent; border: 1px solid var(--mp-line); border-radius: .5rem; padding: .5rem .6rem; resize: vertical; }
  .mp-dialog textarea[name="note"] { background: var(--mp-note); color: var(--mp-note-ink); border-color: transparent; }
  .mp-actions { display: flex; gap: .5rem; align-items: center; }
  .mp-actions .mp-spacer { flex: 1; }
  .mp-actions button { border-radius: .5rem; padding: .5rem .9rem; border: 1px solid var(--mp-line); background: none; }
  .mp-actions .mp-primary { background: var(--mp-basil); border-color: var(--mp-basil); color: var(--mp-paper); font-weight: 650; }
  .mp-actions .mp-danger { color: var(--mp-danger); border-color: transparent; padding-left: 0; }
</style>

<div class="mp">
  <nav class="mp-tabs" role="tablist">
    <button type="button" class="mp-tab" role="tab" id="mpTabPlan" aria-selected="true">Next two weeks</button>
    <button type="button" class="mp-tab" role="tab" id="mpTabArchive" aria-selected="false">History</button>
  </nav>

  <section id="mpPlan" role="tabpanel" aria-labelledby="mpTabPlan"></section>

  <section id="mpArchive" class="mp-archive" role="tabpanel" aria-labelledby="mpTabArchive" hidden>
    <input id="mpSearch" class="mp-search" type="search" placeholder="Search past meals and notes">
    <div id="mpArchiveList"></div>
  </section>

  <p id="mpStatus" class="mp-status" role="status"></p>

  <dialog id="mpDialog" class="mp-dialog">
    <form method="dialog" id="mpForm">
      <h2 id="mpDialogTitle"></h2>
      <label>Meal
        <input name="name" required list="mpPastMeals" autocomplete="off" placeholder="e.g. Lentil soup">
      </label>
      <datalist id="mpPastMeals"></datalist>
      <label>Description (optional)
        <textarea name="description" rows="2"></textarea>
      </label>
      <label>Link (optional)
        <input name="link" type="text" inputmode="url" autocomplete="off" placeholder="https://">
      </label>
      <label>Something special? (optional)
        <textarea name="note" rows="2" placeholder="e.g. Bob is out of town, no leftovers needed for tomorrow's lunchbox"></textarea>
      </label>
      <div class="mp-actions">
        <button type="button" id="mpDelete" class="mp-danger">Remove meal</button>
        <span class="mp-spacer"></span>
        <button type="submit" value="cancel" formnovalidate>Cancel</button>
        <button type="submit" value="save" class="mp-primary">Save meal</button>
      </div>
    </form>
  </dialog>
</div>
